<header class="site-header">
  <div class="site-header-inner">
    {% if page.url == '/' %}<h1 class="site-name">Will Thompson</h1>{% else %}<a class="site-name" href="{{ '/' | relative_url }}">Will Thompson</a>{% endif %}
    <nav class="site-nav" aria-label="Main navigation">
      <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}aria-current="page"{% endif %}>Home</a>
      <a href="{{ '/publications/' | relative_url }}" {% if page.url == '/publications/' %}aria-current="page"{% endif %}>Publications</a>
      <a href="{{ '/blog/' | relative_url }}" {% if page.url contains '/blog/' %}aria-current="page"{% endif %}>Writing &amp; projects</a>
      <a href="{{ '/cv/' | relative_url }}" {% if page.url == '/cv/' %}aria-current="page"{% endif %}>CV</a>
    </nav>
  </div>
</header>
