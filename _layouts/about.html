---
layout: default
---
<main class="home-page">
  {% if page.profile.image %}
  <img class="home-portrait" src="{{ page.profile.image | prepend: '/assets/img/' | relative_url }}" alt="Portrait of Will Thompson" width="150" height="150">
  {% endif %}
  <div class="home-main">
    {{ content }}
  </div>
  {% if page.news %}{% include news.html %}{% endif %}
  {% if page.selected_papers %}{% include selected_papers.html %}{% endif %}
  {% include selected_talks.html %}
  <section class="contact-block">
    <h2>Contact</h2>
    <p>{{ site.contact_note }}</p>
  </section>
</main>
